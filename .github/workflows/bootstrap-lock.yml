name: RAI-112 lock bootstrap

on:
  push:
    branches:
      - feat/rai112-policy-enforcement
    paths:
      - '.github/workflows/bootstrap-lock.yml'
      - 'package.json'

permissions:
  contents: write

jobs:
  generate-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/rai112-policy-enforcement
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'

      - name: Pin npm lock compiler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.19.1
          npm --version

      - name: Generate npm lock
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit

      - name: Commit npm lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "chore: generate deterministic npm lock"
            git push origin HEAD:feat/rai112-policy-enforcement
          fi

      - name: Fresh-install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit

      - name: Audit High/Critical dependencies
        run: npm audit --audit-level=high
